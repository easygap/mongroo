name: mongroo
description: 감정을 기록하고 한 그루씩 키워 가는 몽그루
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
