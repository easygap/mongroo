name: mongroo
description: 감정을 기록하고 한 그루씩 키워 가는 몽그루
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/illustrations/
    - assets/characters/
    - assets/decorations/
    - assets/companions/
    - assets/plants/
    - assets/wardrobe/bodies/
    - assets/wardrobe/inners/
    - assets/wardrobe/outfits/
    - assets/wardrobe/previews/
    - assets/rooms/
    - assets/adventure/
    - assets/adventure/effects/care-vines/
    - assets/adventure/effects/safe-guard/
    - assets/adventure/effects/ember-arc/
    - assets/adventure/effects/prism-burst/
    - assets/adventure/effects/mist-dash/
    - assets/adventure/effects/insight-arc/
    - assets/adventure/effects/echo-wave/
    - assets/adventure/effects/enemy-wave/
    - assets/adventure/sfx/
    - assets/species/
    - assets/fonts/LICENSE-GothicA1.txt
    - assets/fonts/LICENSE-Galmuri.txt
  fonts:
    - family: GothicA1
      fonts:
        - asset: assets/fonts/GothicA1-Regular.ttf
          weight: 400
        - asset: assets/fonts/GothicA1-Bold.ttf
          weight: 700
    # Flutter Web 엔진의 기본 대체 서체도 같은 로컬 파일로
    # 해결해 운영 CSP에서 Google Fonts 요청이 발생하지 않게 한다.
    - family: Roboto
      fonts:
        - asset: assets/fonts/GothicA1-Regular.ttf
          weight: 400
        - asset: assets/fonts/GothicA1-Bold.ttf
          weight: 700
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/GothicA1-Regular.ttf
          weight: 400
        - asset: assets/fonts/GothicA1-Bold.ttf
          weight: 700
    - family: Galmuri11
      fonts:
        - asset: assets/fonts/Galmuri11-Bold.ttf
          weight: 700
