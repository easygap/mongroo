<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="감정 기록, 식물 성장, 일일 퀘스트를 한곳에서 관리하는 앱, 몽그루">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EFEFEF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#20150D">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="몽그루">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="manifest" href="manifest.json">
  <title>몽그루</title>
  <style>
    @font-face {
      font-family: "Galmuri11";
      src: url("assets/assets/fonts/Galmuri11-Bold.ttf") format("truetype");
      font-display: swap;
      font-style: normal;
      font-weight: 700;
    }

    :root {
      color-scheme: light dark;
      --brand-sprout: #b9ee84;
      --brand-ink: #3b1f06;
      --brand-paper: #efefef;
      --canvas: #f2ede3;
      --surface: var(--brand-paper);
      --paper-deep: #e9e1d3;
      --ink: var(--brand-ink);
      --muted: #75685d;
      --edge: rgb(59 31 6 / 20%);
      --shadow: rgb(59 31 6 / 10%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR",
        sans-serif;
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--canvas);
    }

    #app-loading {
      position: fixed;
      z-index: 2147483647;
      inset: 0;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: max(24px, env(safe-area-inset-top)) 24px
        max(24px, env(safe-area-inset-bottom));
      color: var(--ink);
      background: var(--canvas);
      opacity: 1;
      transition: opacity 180ms ease-out, visibility 180ms ease-out;
    }

    #app-loading.is-ready {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .loading-card {
      width: min(100%, 320px);
      box-sizing: border-box;
      padding: 24px;
      text-align: center;
    }

    .loading-icon-shell {
      display: grid;
      overflow: hidden;
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      place-items: center;
      border-radius: 28px;
      box-shadow: 0 14px 30px var(--shadow);
      transform: rotate(-2deg);
      animation: loading-mark 2.6s ease-in-out infinite;
    }

    .loading-icon {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }

    .loading-title {
      margin: 0;
      font-family: "Galmuri11", system-ui, sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.35;
      text-wrap: balance;
    }

    .loading-copy {
      min-height: 24px;
      margin: 8px 0 22px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 1.6;
      text-wrap: pretty;
    }

    .loading-track {
      position: relative;
      overflow: hidden;
      width: 112px;
      height: 4px;
      margin: 0 auto;
      border-radius: 4px;
      background: var(--paper-deep);
    }

    .loading-track::after {
      position: absolute;
      inset: 0;
      width: 44%;
      border-radius: 2px;
      background: var(--brand-ink);
      content: "";
      animation: loading-progress 1.2s ease-in-out infinite;
    }

    .loading-retry {
      min-width: 112px;
      min-height: 48px;
      margin-top: 2px;
      padding: 10px 20px;
      border: 1px solid var(--brand-ink);
      border-radius: 14px;
      color: var(--brand-ink);
      background: var(--brand-sprout);
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 120ms ease-out, filter 120ms ease-out;
    }

    .loading-retry[hidden] {
      display: none;
    }

    @media (hover: hover) {
      .loading-retry:hover {
        filter: brightness(1.03) saturate(1.06);
      }
    }

    .loading-retry:active {
      transform: scale(0.96);
    }

    .loading-retry:focus-visible {
      outline: 3px solid var(--brand-ink);
      outline-offset: 3px;
    }

    @keyframes loading-mark {
      0%, 100% {
        transform: rotate(-2deg) translateY(0);
      }
      50% {
        transform: rotate(0deg) translateY(-4px);
      }
    }

    @keyframes loading-progress {
      from {
        transform: translateX(-110%);
      }
      to {
        transform: translateX(250%);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #20150d;
        --surface: #2d2016;
        --paper-deep: #3b2a1e;
        --ink: var(--brand-paper);
        --muted: #d0c3b5;
        --edge: rgb(248 245 239 / 18%);
        --shadow: rgb(0 0 0 / 30%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading {
        transition: none;
      }

      .loading-icon-shell {
        animation: none;
      }

      .loading-track::after {
        animation: none;
      }

      .loading-track::after {
        width: 68%;
      }
    }
  </style>
</head>
<body>
  <main id="app-loading" role="status" aria-live="polite" aria-atomic="true">
    <section class="loading-card" aria-labelledby="loading-title">
      <div class="loading-icon-shell" aria-hidden="true">
        <img class="loading-icon" src="icons/Icon-192.png" alt="" width="96" height="96">
      </div>
      <h1 class="loading-title" id="loading-title">몽그루</h1>
      <p class="loading-copy" id="loading-copy">
        앱을 불러오는 중…
      </p>
      <div class="loading-track" id="loading-track" aria-hidden="true"></div>
      <button class="loading-retry" id="loading-retry" type="button" hidden>
        다시 불러오기
      </button>
    </section>
  </main>

  <noscript>
    <style>#app-loading { display: none; }</style>
    몽그루를 사용하려면 JavaScript를 켜 주세요.
  </noscript>

  <script>
    (() => {
      const loading = document.getElementById('app-loading');
      const copy = document.getElementById('loading-copy');
      const track = document.getElementById('loading-track');
      const retry = document.getElementById('loading-retry');
      let completed = false;

      const restoreZoomableViewport = () => {
        const viewport = document.querySelector('meta[name="viewport"]');
        if (!viewport) return;
        const content =
          'width=device-width, initial-scale=1.0, viewport-fit=cover';
        if (viewport.getAttribute('content') !== content) {
          viewport.setAttribute('content', content);
        }
      };
      const viewportObserver = new MutationObserver(restoreZoomableViewport);
      viewportObserver.observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['content'],
      });
      restoreZoomableViewport();

      performance.mark('mongroo-shell-ready');

      const showRecovery = () => {
        if (completed) return;
        copy.textContent = '불러오기가 조금 오래 걸리고 있어요. 네트워크를 확인해 주세요.';
        track.hidden = true;
        retry.hidden = false;
      };

      const watchdog = window.setTimeout(showRecovery, 20000);
      retry.addEventListener('click', () => window.location.reload());

      window.addEventListener('flutter-first-frame', () => {
        completed = true;
        restoreZoomableViewport();
        window.setTimeout(() => viewportObserver.disconnect(), 1000);
        window.clearTimeout(watchdog);
        performance.mark('mongroo-flutter-first-frame');
        loading.classList.add('is-ready');
        const removalDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          ? 0
          : 220;
        window.setTimeout(() => loading.remove(), removalDelay);
      }, { once: true });

      window.addEventListener('error', (event) => {
        if (event.target?.id === 'flutter-bootstrap') showRecovery();
      }, { capture: true });
    })();
  </script>
  <script id="flutter-bootstrap" src="flutter_bootstrap.js" defer></script>
</body>
</html>
