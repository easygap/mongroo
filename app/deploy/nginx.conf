server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    include /etc/nginx/snippets/mongroo-security.conf;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm application/x-font-ttf font/ttf image/svg+xml text/css;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
        proxy_buffering off;
    }

    location ~* \.(?:webp|png|jpg|jpeg|gif|ico|woff2?|ttf)$ {
        include /etc/nginx/snippets/mongroo-security.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(?:wasm|mjs|js|json|bin|css)$ {
        include /etc/nginx/snippets/mongroo-security.conf;
        expires -1;
        add_header Cache-Control "max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/mongroo-security.conf;
        add_header Cache-Control "max-age=0, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
