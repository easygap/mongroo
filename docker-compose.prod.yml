services:
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-production-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    build: ./server
    restart: "no"
    env_file: ${MONGROO_ENV_FILE:-.env.production}
    depends_on:
      mysql:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    build: ./server
    restart: unless-stopped
    env_file: ${MONGROO_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: ./server
    profiles: ["ai"]
    restart: unless-stopped
    env_file: ${MONGROO_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.ai_worker"]

  web:
    build: ./app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mysql-production-data:
