name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wardrobe-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check wardrobe input changes
        id: wardrobe_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_AFTER_SHA"
          fi

          if [[ "$base_sha" =~ ^0+$ ]] || \
            ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git diff --quiet "$base_sha" "$head_sha" -- \
            design-system/concepts/wardrobe-v1/ \
            design-system/scripts/
          diff_status=$?
          set -e
          if [ "$diff_status" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$diff_status" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            exit "$diff_status"
          fi
      - uses: actions/setup-python@v5
        if: steps.wardrobe_changes.outputs.changed == 'true'
        with:
          python-version: "3.12"
      - name: Install wardrobe builder dependencies
        if: steps.wardrobe_changes.outputs.changed == 'true'
        run: python -m pip install Pillow
      - name: Validate wardrobe contract
        if: steps.wardrobe_changes.outputs.changed == 'true'
        run: |
          validation_root="$(mktemp -d)"
          trap 'rm -rf "$validation_root"' EXIT
          python design-system/scripts/build_wardrobe_layers.py \
            --source-root design-system/concepts/wardrobe-v1 \
            --output-root "$validation_root/output" \
            --qa-root "$validation_root/qa" \
            --manifest "$validation_root/wardrobe-layers.json"

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      APP_ENV: test
      AI_MODE: fake
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" sqlalchemy alembic aiosqlite aiomysql cryptography "pydantic[email]" pydantic-settings argon2-cffi PyJWT httpx tzdata kiwipiepy pytest pytest-asyncio "ruff==0.16.0"
      - name: Lint
        run: python -m ruff check app tests
      - name: Test
        run: python -m pytest -q
      - name: Validate expedition content
        run: python -m app.content.expeditions.validator app/content/expeditions/v1/*.json
      - name: OpenAPI drift check
        run: |
          python -m app.export_openapi
          git diff --exit-code openapi.json

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build WebAssembly release
        run: flutter build web --wasm --release --no-pub
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  production-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        run: MONGROO_ENV_FILE=.env.production.example docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
      - name: Build API image
        run: docker build --pull --tag mongroo-api:ci server
      - name: Build Web image
        run: docker build --pull --tag mongroo-web:ci app
